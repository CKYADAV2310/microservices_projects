server:
  port: 8085

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      default-filters:
        - PreserveHostHeader
      routes:
        # Auth Service: Open access for Login/Registration
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
          filters:
            # This removes the first "/auth" so Auth-Service sees "/register"
            - StripPrefix=0

        # Product Service: Protected by AuthenticationFilter
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/product/**
          filters:
            - name: AuthenticationFilter

        # Cart Service: Protected by AuthenticationFilter
        - id: cart-service
          uri: lb://CART-SERVICE
          predicates:
            - Path=/cart/**
          filters:
            - name: AuthenticationFilter

# Swagger Aggregation Config for Documentation
springdoc:
  swagger-ui:
    enabled: true
    urls:
      - name: Auth-Service
        url: /auth/v3/api-docs
      - name: Product-Service
        url: /product/v3/api-docs
      - name: Cart-Service
        url: /cart/v3/api-docs
    server:
      url: /

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/